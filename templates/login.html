<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RRFS Meteorologia</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg-primary: #0a0e1a;
        --bg-card: #1a2133;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --border: #2a3448;
        --danger: #ef4444;
        --success: #10b981;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .bg-animation {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        background:
            radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .logo {
        text-align: center;
        font-size: 48px;
        margin-bottom: 8px;
    }

    h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 4px;
    }

    .subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 30px;
    }

    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        background: var(--bg-primary);
        padding: 4px;
        border-radius: 10px;
    }

    .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        transition: all 0.2s;
    }

    .tab.active {
        background: var(--accent);
        color: white;
    }

    .form-group {
        margin-bottom: 16px;
    }

    label {
        display: block;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
        transition: border-color 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--accent);
    }

    .btn {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
    }

    .message.error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        display: block;
    }

    .message.success {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #6ee7b7;
        display: block;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="card">
        <div class="logo">🌦️</div>
        <h1>RRFS Meteorologia</h1>
        <p class="subtitle">Acesse sua conta</p>

        <div class="tabs">
            <div class="tab active" data-tab="login">Login</div>
            <div class="tab" data-tab="register">Registrar</div>
        </div>

        <div id="message" class="message"></div>

        <!-- LOGIN -->
        <div class="form-section active" id="login-section">
            <form id="login-form">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="login-username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="login-btn">Entrar</button>
            </form>
        </div>

        <!-- REGISTER -->
        <div class="form-section" id="register-section">
            <form id="register-form">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="register-password" required minlength="6">
                </div>
                <button type="submit" class="btn" id="register-btn">Criar Conta</button>
            </form>
        </div>
    </div>

<script>
    const tabs = document.querySelectorAll('.tab');
    const sections = document.querySelectorAll('.form-section');
    const messageEl = document.getElementById('message');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab + '-section').classList.add('active');
            hideMessage();
        });
    });

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
    }

    function hideMessage() {
        messageEl.className = 'message';
        messageEl.textContent = '';
    }

    // LOGIN
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Entrando...';
        hideMessage();

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });

            const data = await res.json();

            if (res.ok) {
                showMessage('Login realizado! Redirecionando...', 'success');
                setTimeout(() => {
                    window.location.href = data.is_admin ? '/admin' : '/dashboard';
                }, 800);
            } else {
                showMessage(data.error || 'Erro ao fazer login', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        } catch (err) {
            showMessage('Erro de conexão com o servidor', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Entrar';
        }
    });

    // REGISTER
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('register-btn');
        const username = document.getElementById('register-username').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Registrando...';
        hideMessage();

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, email, password})
            });

            const data = await res.json();

            if (res.ok) {
                showMessage(data.message || 'Registro concluído!', 'success');
                document.getElementById('register-form').reset();
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                }, 1500);
            } else {
                showMessage(data.error || 'Erro ao registrar', 'error');
            }
        } catch (err) {
            showMessage('Erro de conexão com o servidor', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Criar Conta';
        }
    });
</script>
</body>
</html>
