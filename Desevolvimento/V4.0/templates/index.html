<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRFS Meteorologia</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg-primary: #0a0e1a;
        --bg-secondary: #131824;
        --bg-card: #1a2133;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --border: #2a3448;
        --success: #10b981;
        --danger: #ef4444;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
    }

    .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background:
            radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
    }

    .container {
        text-align: center;
        max-width: 600px;
        padding: 40px 20px;
    }

    .logo {
        font-size: 64px;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
    }

    h1 {
        font-size: 42px;
        font-weight: 700;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #3b82f6, #10b981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .subtitle {
        color: var(--text-secondary);
        font-size: 16px;
        margin-bottom: 40px;
        line-height: 1.6;
    }

    .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 40px;
    }

    .feature {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px 12px;
        transition: transform 0.2s, border-color 0.2s;
    }

    .feature:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
    }

    .feature-icon {
        font-size: 28px;
        margin-bottom: 8px;
    }

    .feature-text {
        font-size: 13px;
        color: var(--text-secondary);
    }

    .btn {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 14px 40px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.2s;
        border: none;
        cursor: pointer;
    }

    .btn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }

    @media (max-width: 480px) {
        .features { grid-template-columns: 1fr; }
        h1 { font-size: 32px; }
    }
</style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container">
        <div class="logo">🌦️</div>
        <h1>RRFS Meteorologia</h1>
        <p class="subtitle">
            Sistema inteligente de previsão com aprendizado adaptativo,
            múltiplos modelos climáticos e análise por IA.
        </p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-text">Previsões Precisas</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <div class="feature-text">IA Adaptativa</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📡</div>
                <div class="feature-text">Radar em Tempo Real</div>
            </div>
        </div>

        <a href="/login" class="btn">Entrar no Sistema</a>
    </div>
</body>
</html>
